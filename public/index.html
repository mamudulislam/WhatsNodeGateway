<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp GateWay | Bright Future Soft</title>
    <!-- Modern Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --primary: #00a884;
            --primary-dark: #008f6f;
            --secondary: #111b21;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #22c55e;
            --error: #ef4444;
            --warning: #f59e0b;
        }

        [data-theme="dark"] {
            --bg: #0b141a;
            --card-bg: #111b21;
            --text-main: #e9edef;
            --text-muted: #8696a0;
            --border: #222e35;
        }

        * {
            box-sizing: border-box;
            transition: background 0.3s, color 0.3s, border 0.3s;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 24px;
        }

        header {
            width: 100%;
            max-width: 1200px;
            padding: 0 0 32px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .logo span {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
            position: relative;
            overflow: hidden;
        }

        h2 {
            margin: 0 0 24px 0;
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h2 svg { width: 20px; height: 20px; color: var(--primary); }

        /* Status Section */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 24px;
        }

        .st-waiting { background: #fffbeb; color: #b45309; }
        .st-ready { background: #f0fdf4; color: #15803d; }
        .st-error { background: #fef2f2; color: #b91c1c; }

        .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        .st-waiting .indicator { animation: pulse 1.5s infinite; }

        /* QR Code Layout */
        #qr-container {
            text-align: center;
            padding: 20px;
            background: #fafafa;
            border-radius: 16px;
            border: 2px dashed #e2e8f0;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        [data-theme="dark"] #qr-container { background: #0b141a; border-color: #222e35; }

        #qr-image {
            width: 240px;
            height: 240px;
            object-fit: contain;
            user-select: none;
            cursor: pointer;
        }

        .qr-placeholder {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* Form Controls */
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 0.9rem; color: var(--text-muted); }
        input, textarea {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-family: inherit;
            font-size: 0.95rem;
            background: var(--bg);
            color: var(--text-main);
            transition: all 0.2s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0, 168, 132, 0.1);
        }

        button {
            padding: 14px 24px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.95rem;
        }

        .btn-primary { background: var(--primary); color: white; width: 100%; }
        .btn-primary:hover:not(:disabled) { background: var(--primary-dark); transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-logout { 
            background: transparent; 
            color: var(--error); 
            border: 1.5px solid var(--error); 
            margin-top: 12px;
            width: 100%;
        }
        .btn-logout:hover:not(:disabled) { background: #fff1f2; }

        /* Logs & History */
        .scroller {
            height: 250px;
            overflow-y: auto;
            border-radius: 12px;
            background: #fdfdfd;
            border: 1px solid var(--border);
            padding: 12px;
        }

        [data-theme="dark"] .scroller { background: #0c1c24; }

        .log-item {
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.8rem;
            display: flex;
            gap: 12px;
        }
        .log-time { color: var(--primary); font-weight: 600; min-width: 65px; }

        .history-item {
            padding: 12px;
            background: var(--bg);
            border-radius: 10px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
        }

        .status-tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            float: right;
        }
        .tag-sent { background: #dcfce7; color: #166534; }
        .tag-failed { background: #fee2e2; color: #991b1b; }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
        }

        /* Branding link */
        .footer-brand {
            margin-top: 40px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .footer-brand a { color: var(--primary); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <h1>WhatsApp Gateway</h1>
            <span>by Bright Future Soft</span>
        </div>
        <div id="theme-toggle">
            <!-- Theme toggle space -->
        </div>
    </header>

    <div class="container">
        <!-- Sidebar: Status & Auth -->
        <div class="card">
            <h2>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                System Status
            </h2>
            
            <div id="status-badge" class="status-badge st-waiting">
                <div class="indicator"></div>
                <span id="status-text">Booting Engine...</span>
            </div>

            <div id="qr-container">
                <div id="qr-content" class="qr-placeholder">
                    <svg style="width: 48px; height: 48px; opacity: 0.3; margin-bottom: 15px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><path d="M14 14h3m3 0v3m0 3h-3m-3 0v-3m3 0h3"></path></svg>
                    <p>Waking up Puppeteer...<br>Please wait.</p>
                </div>
            </div>

            <h2 style="margin-top: 20px; font-size: 1rem;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9H3m9 9a9 9 0 0 1-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9"></path></svg>
                Engine Logs
            </h2>
            <div id="app-logs" class="scroller">
                <div class="log-item">Ready for operation...</div>
            </div>

            <button id="logoutBtn" class="btn-logout" disabled>
                <svg style="width:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                Terminate Session
            </button>
        </div>

        <!-- Main Content: Controls -->
        <div class="card">
            <h2>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"></path><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                Programmatic Sender
            </h2>
            
            <form id="sendForm">
                <div class="form-group">
                    <label>Recipient Phone Number (Full E.164 without +)</label>
                    <input type="text" id="phone" placeholder="e.g. 8801792205520" required>
                </div>
                <div class="form-group">
                    <label>Message Content</label>
                    <textarea id="message" rows="4" placeholder="Type message payload here..." required></textarea>
                </div>
                <button type="submit" id="sendBtn" class="btn-primary" disabled>
                    Send Outbound Message
                </button>
            </form>
            <div id="api-feedback" style="margin-top: 12px; font-size: 0.9rem;"></div>

            <h2 style="margin-top: 32px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                Recent Transmissions (Top 50)
            </h2>
            <div id="history-logs" class="scroller" style="height: 300px;">
                <div class="qr-placeholder" style="padding-top:100px;">Load messages from DB...</div>
            </div>
        </div>
    </div>

    <div class="footer-brand">
        Official Technical Task Implementation for <a href="https://www.brightfuturesoft.com" target="_blank">Bright Future Soft</a>
    </div>

    <script>
        const logsBox = document.getElementById('app-logs');
        const stBadge = document.getElementById('status-badge');
        const stText = document.getElementById('status-text');
        const qrContainer = document.getElementById('qr-container');
        const qrContent = document.getElementById('qr-content');
        const sendBtn = document.getElementById('sendBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const historyBox = document.getElementById('history-logs');

        function addLog(msg) {
            const entry = document.createElement('div');
            entry.className = 'log-item';
            entry.innerHTML = `<span class="log-time">${new Date().toLocaleTimeString()}</span> <span>${msg}</span>`;
            logsBox.prepend(entry);
        }

        const socket = io();

        socket.on('connect', () => {
            addLog('Socket connected to backend');
            fetchStatus();
        });

        async function fetchStatus() {
            try {
                const res = await fetch('/api/auth/status');
                const { data } = await res.json();
                
                if (data.ready) handleStateReady();
                else if (data.qrAvailable) showQR(data.qrUrl);
                else {
                    addLog('Waiting for WhatsApp initialization...');
                    stText.textContent = 'Initializing Engine...';
                }
            } catch (e) {
                addLog('Failed to fetch status from engine');
            }
        }

        function handleStateReady() {
            stBadge.className = 'status-badge st-ready';
            stText.textContent = 'Active & Connected';
            qrContainer.innerHTML = `
                <div style="text-align:center">
                    <div style="font-size: 64px; color: var(--primary);">✓</div>
                    <div style="font-weight: 700; font-size: 1.2rem; margin-top: 10px;">Session Active</div>
                    <p style="color: var(--text-muted); font-size: 0.9rem;">Authenticated via LocalAuth</p>
                </div>
            `;
            sendBtn.disabled = false;
            logoutBtn.disabled = false;
        }

        function showQR(url) {
            stBadge.className = 'status-badge st-waiting';
            stText.textContent = 'Awaiting Device Scan';
            qrContainer.innerHTML = `
                <img id="qr-image" src="${url}" alt="WhatsApp QR">
                <p style="margin-top: 15px; font-size: 0.8rem; color: var(--text-muted);">
                    Scan this with your mobile phone<br>to link the gateway.
                </p>
            `;
            sendBtn.disabled = true;
            logoutBtn.disabled = true;
        }

        socket.on('qr', (data) => {
            addLog('Fresh QR transmission received');
            showQR(data.url || data);
        });

        socket.on('ready', () => {
            addLog('WhatsApp Engine is now READY');
            handleStateReady();
        });

        socket.on('authenticated', () => {
            addLog('Session Authentication Successful');
        });

        socket.on('disconnected', (reason) => {
            addLog('Critical: Gateway Disconnected - ' + (reason.reason || 'Manual'));
            stBadge.className = 'status-badge st-error';
            stText.textContent = 'Disconnected';
            qrContainer.innerHTML = '<div class="qr-placeholder">Engine offline. Restarting...</div>';
            sendBtn.disabled = true;
        });

        // Form Handling
        document.getElementById('sendForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('phone').value;
            const message = document.getElementById('message').value;
            const feedback = document.getElementById('api-feedback');

            feedback.innerHTML = '<span style="color:var(--text-muted)">Dispatched to queue...</span>';
            sendBtn.disabled = true;

            try {
                const res = await fetch('/api/messages/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, message })
                });
                const result = await res.json();
                
                if (res.ok) {
                    feedback.innerHTML = '<span style="color:var(--success)">✓ Transmission success!</span>';
                    document.getElementById('message').value = '';
                    addLog('Sent message to ' + phone);
                    loadHistory();
                } else {
                    feedback.innerHTML = `<span style="color:var(--error)">× Error: ${result.error || 'Failed'}</span>`;
                }
            } catch (err) {
                feedback.innerHTML = '<span style="color:var(--error)">× Network isolation error</span>';
            } finally {
                sendBtn.disabled = false;
            }
        });

        async function loadHistory() {
            try {
                const res = await fetch('/api/messages/logs');
                const { data } = await res.json();
                if (!data || data.length === 0) {
                    historyBox.innerHTML = '<div class="qr-placeholder" style="padding-top:100px;">No message logs found in database.</div>';
                    return;
                }
                historyBox.innerHTML = data.map(item => `
                    <div class="history-item">
                        <span class="status-tag ${item.status === 'sent' ? 'tag-sent' : 'tag-failed'}">${item.status}</span>
                        <div style="font-weight:700; font-size: 0.9rem;">${item.phone}</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">${item.message}</div>
                        ${item.error ? `<div style="color: var(--error); font-size: 0.7rem; margin-top: 4px;">Error: ${item.error}</div>` : ''}
                        <div style="font-size: 0.65rem; color: #cbd5e1; margin-top: 4px;">${item.timestamp}</div>
                    </div>
                `).join('');
            } catch (e) {
                historyBox.innerHTML = '<div class="qr-placeholder">Failed to load history data.</div>';
            }
        }

        logoutBtn.addEventListener('click', async () => {
            if (!confirm('Are you sure you want to terminate the active session and logout?')) return;
            addLog('Dispatching logout request...');
            logoutBtn.disabled = true;
            try {
                const res = await fetch('/api/auth/logout', { method: 'POST' });
                const result = await res.json();
                if (result.success) {
                    addLog('Session terminated. Reinitializing engine.');
                }
            } catch (e) {
                addLog('Logout request failed');
            }
        });

        // Init
        loadHistory();
        setInterval(loadHistory, 15000);
    </script>
</body>
</html>
